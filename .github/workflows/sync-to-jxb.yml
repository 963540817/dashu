name: Sync to jxb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to jxb
        run: |
          # 注意这里去掉了强制的账号名，交给 Token 验证
          git remote add jxb https://${{ secrets.JXB_SYNC_TOKEN }}@github.com/qq963540817/jxb.git
          git push jxb HEAD:main --force
