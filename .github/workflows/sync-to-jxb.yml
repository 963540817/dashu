name: Sync to jxb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Push to jxb
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.JXB_SYNC_TOKEN }}
        with:
          source-directory: '.'
          destination-github-username: 'qq963540817' # 目标账号
          destination-repository-name: 'jxb'         # 目标仓库
          user-email: 'actions@github.com'
          target-branch: main
